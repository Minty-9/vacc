<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#a86aa0">
<title>Enroll — VACC Learn</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Nunito:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://js.paystack.co/v1/inline.js"></script>
<style>
:root{--brand:#a86aa0;--brand-dark:#8a4f82;--text:#1a1a2e;--muted:#6b7280;--border:#e5e7eb;--bg:#f7f3f7;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem;}
.card{background:#fff;border:1px solid var(--border);border-radius:20px;max-width:440px;width:100%;overflow:hidden;box-shadow:0 20px 60px rgba(168,106,160,0.12);}
.thumb{height:130px;background:linear-gradient(135deg,var(--brand-dark),var(--brand));display:flex;align-items:center;justify-content:center;font-size:2.8rem;}
.thumb img{width:44px;height:44px;object-fit:contain;}
.body{padding:1.6rem;}
h1{font-family:'Playfair Display',serif;font-size:1.3rem;font-weight:700;margin-bottom:0.4rem;}
.desc{font-size:0.85rem;color:var(--muted);line-height:1.5;margin-bottom:1rem;}
.meta{display:flex;justify-content:space-between;font-size:0.8rem;color:var(--muted);border-top:1px solid #f3f4f6;padding-top:0.9rem;margin-top:0.9rem;}
.price{font-family:'Playfair Display',serif;font-size:1.6rem;font-weight:700;color:var(--brand-dark);margin:1.1rem 0 0.3rem;}
.field{margin:1.1rem 0 0.4rem;}
.field label{display:block;font-size:0.78rem;font-weight:700;color:#374151;margin-bottom:0.4rem;}
.field input{width:100%;border:1.5px solid var(--border);border-radius:10px;padding:0.75rem 1rem;font-size:0.92rem;outline:none;}
.field input:focus{border-color:var(--brand);}
.hint{font-size:0.72rem;color:var(--muted);margin-top:0.35rem;line-height:1.5;}
.btn{width:100%;padding:0.9rem;background:linear-gradient(135deg,var(--brand),var(--brand-dark));color:#fff;border:none;border-radius:11px;font-size:0.95rem;font-weight:700;cursor:pointer;margin-top:1.1rem;box-shadow:0 6px 20px rgba(168,106,160,0.35);}
.btn:disabled{opacity:0.6;cursor:not-allowed;}
.state{text-align:center;padding:2rem 1rem;color:var(--muted);font-size:0.9rem;}
.err{background:#fef2f2;border:1px solid #fecaca;color:#ef4444;font-size:0.82rem;padding:0.7rem 0.9rem;border-radius:10px;margin-top:0.9rem;display:none;}
.success{text-align:center;padding:1rem 0.5rem;}
.success h2{font-family:'Playfair Display',serif;font-size:1.3rem;margin-bottom:0.6rem;}
.success p{font-size:0.85rem;color:var(--muted);line-height:1.6;margin-bottom:1.2rem;}
</style>
</head>

function showErr(msg){
  const el = document.getElementById('err');
  el.textContent = msg;
  el.style.display = 'block';
}

function startCheckout(course){
  const emailInput = document.getElementById('email');
  const email = emailInput.value.trim();
  if (!email || !email.includes('@')){ showErr('Please enter a valid email address.'); return; }
  document.getElementById('err').style.display = 'none';

  if (!course.is_paid){
    // Free course: skip Paystack entirely, go straight to signup with a deep link.
    window.location.href = APP_URL + '?course=' + encodeURIComponent(course.id) + '&prefillEmail=' + encodeURIComponent(email);
    return;
  }

  if (!window.PaystackPop){ showErr('Payment system failed to load. Please refresh and try again.'); return; }
  const btn = document.getElementById('payBtn');
  btn.disabled = true; btn.textContent = 'Opening checkout…';

  const ref = 'VACCGUEST-' + Date.now() + '-' + Math.random().toString(36).slice(2,8);
  const handler = PaystackPop.setup({
    key: PAYSTACK_PUBLIC_KEY,
    email: email,
    amount: Math.round(course.price * 100),
    currency: 'NGN',
    ref: ref,
    metadata: { courseId: course.id, guestEmail: email },
    callback: function(response){
      btn.textContent = 'Confirming payment…';
      fetch('/.netlify/functions/verify-guest-payment', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ reference: response.reference, email: email, courseId: course.id })
      }).then(r => r.json()).then(res => {
        const claimUrl = APP_URL + '?course=' + encodeURIComponent(course.id) + '&claim=' + encodeURIComponent(response.reference) + '&prefillEmail=' + encodeURIComponent(email);
        const signupButton = '<button class="btn" onclick="window.location.href=\'' + claimUrl + '\'">Create My Account →</button>';
        if (res && res.success){
          content.innerHTML =
            '<div class="success"><h2>Payment confirmed! 🎉</h2>' +
            '<p>Create your free VACC Learn account with <strong>' + esc(email) + '</strong> to get instant access to <strong>' + esc(course.title) + '</strong>.</p>' +
            signupButton + '</div>';
        } else {
          // Not confirmed yet (common for bank transfers, which can take a few minutes).
          // The webhook will record the payment server-side as soon as Paystack confirms it,
          // so sending them on to sign up now is safe — the account just links up to the
          // payment automatically once it lands, rather than leaving them stuck here.
          content.innerHTML =
            '<div class="success"><h2>Payment received</h2>' +
            '<p>Reference <strong>' + esc(response.reference) + '</strong>. Bank transfers can take a few minutes to confirm. Go ahead and create your account with <strong>' + esc(email) + '</strong> now — we\'ll finish linking your payment automatically. If it hasn\'t unlocked after a few minutes, contact support with this reference (do not pay again).</p>' +
            signupButton + '</div>';
        }
      }).catch(() => {
        const claimUrl = APP_URL + '?course=' + encodeURIComponent(course.id) + '&claim=' + encodeURIComponent(response.reference) + '&prefillEmail=' + encodeURIComponent(email);
        content.innerHTML =
          '<div class="success"><h2>Payment received</h2>' +
          '<p>Reference <strong>' + esc(response.reference) + '</strong>. We couldn\'t confirm it automatically just now, but go ahead and create your account with <strong>' + esc(email) + '</strong> — we\'ll finish linking your payment once it confirms. If it hasn\'t unlocked after a few minutes, contact support with this reference (do not pay again).</p>' +
          '<button class="btn" onclick="window.location.href=\'' + claimUrl + '\'">Create My Account →</button></div>';
      });
    },
    onClose: function(){ btn.disabled = false; btn.textContent = 'Pay ' + money(course.price) + ' to Enroll'; }
  });
  handler.openIframe();
}
</script>
</body>
</html>
